<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- No analytics.js here, so the daily canary doesn't count as a visit -->
<title>I-5 Express Lanes health check</title>
<style>body { font-family: system-ui, sans-serif; margin: 2rem; } li { margin: 0.25rem 0; }</style>
<script src="https://andrewmacheret.com/healthcheck.js"></script>
</head>
<body>
<h1>I-5 Express Lanes health check</h1>
<script>
const HOUR = 3600000;

function loads(url) {
  return new Promise((resolve) => {
    const img = new Image();
    const timer = setTimeout(() => resolve(false), 15000);
    img.onload = () => { clearTimeout(timer); resolve(img.naturalWidth > 0); };
    img.onerror = () => { clearTimeout(timer); resolve(false); };
    img.src = url;
  });
}

healthcheck([
  { name: 'Page', url: '../', assets: true, contains: 'I-5 Express Lanes' },
  { name: 'I-5 API', url: 'https://i5.andrewmacheret.com/healthcheck', healthcheck: true },
  { name: 'README badge', url: 'https://i5.andrewmacheret.com/badge.svg', image: true },
  {
    // A camera or two being down is normal, so only fail when most pictures don't load
    name: 'Camera pictures',
    url: 'https://i5.andrewmacheret.com/status',
    json: async (status) => {
      const express = (status.cameras || []).filter((c) => c.express);
      if (!express.length) throw new Error('no express lane cameras in /status');
      const picks = [...new Set([0, 1, 2, 3].map((i) => express[Math.floor((i * (express.length - 1)) / 3)]))];
      const ok = (await Promise.all(picks.map((c) => loads(c.image)))).filter(Boolean).length;
      if (ok * 2 < picks.length) throw new Error(`only ${ok} of ${picks.length} pictures load`);
      return `${ok} of ${picks.length} pictures load`;
    }
  },
  {
    name: 'WSDOT Traffic on Bluesky',
    url: 'https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor=traffic.wsdot.wa.gov&limit=1',
    json: (body) => {
      const post = body.feed && body.feed[0];
      if (!post) throw new Error('no posts');
      const hours = Math.round((Date.now() - Date.parse(post.post.indexedAt)) / HOUR);
      if (hours > 7 * 24) throw new Error(`last post ${hours} hours ago`);
      return `last post ${hours} hours ago`;
    }
  }
]);
</script>
</body>
</html>
