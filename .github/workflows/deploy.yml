name: Test and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/canary.yml'
      # only README images
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  S3_PATH: s3://andrewmacheret.com/projects/i5
  API_URL: https://i5.andrewmacheret.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Not Seattle time, so tests catch code that leans on the computer's time zone
      - run: npm test
        env:
          TZ: Asia/Tokyo
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      # Everything under projects/i5 comes from this repo, so --delete is safe.
      # Files in assets/ have a content hash in their name, so they can be cached forever.
      - name: Upload website
        run: |
          aws s3 sync dist "$S3_PATH" --delete --exclude 'assets/*' --exclude index.html --cache-control max-age=300
          aws s3 sync dist/assets "$S3_PATH/assets" --delete --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp dist/index.html "$S3_PATH/index.html" --cache-control no-cache
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/projects/i5/*'
      - name: Smoke test
        run: |
          curl -sSf https://andrewmacheret.com/projects/i5/ | grep -q 'I-5 Express Lanes'
          curl -sSf "$API_URL/status" | jq -e '.published.segments | length > 0'
